[project]
name = "hopfield"
version = "0.1.0"
description = "Hopfield network capacity, phase diagram, spurious states, pseudo-inverse rule"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "numba"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
